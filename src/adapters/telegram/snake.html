<style>
  body {
    margin: 0;
    padding: 12px 12px 28px;
    color: var(--tg-theme-text-color, #fff);
    background: var(--tg-theme-bg-color, #17212b);
    font-family: sans-serif;
    text-align: center;
  }
  canvas {
    width: 100%;
    max-width: 220px;
    background: #101820;
    border-radius: 8px;
  }
  button {
    min-width: 56px;
    min-height: 44px;
    margin: 3px;
    border: 0;
    border-radius: 8px;
    background: var(--tg-theme-button-color, #3390ec);
    color: var(--tg-theme-button-text-color, #fff);
    font-size: 18px;
  }
  p {
    margin: 8px 0;
  }
</style>
<p><strong>🐍 Змейка</strong> · <span id="score">Счёт: 0</span></p>
<div id="game">
  <canvas id="board" width="280" height="280" aria-label="Игровое поле змейки"></canvas>
  <p id="status" role="status">Нажмите «Старт»</p>
  <div><button id="up" aria-label="Вверх">↑</button></div>
  <div>
    <button id="left" aria-label="Влево">←</button><button id="down" aria-label="Вниз">↓</button
    ><button id="right" aria-label="Вправо">→</button>
  </div>
  <div><button id="restart">Старт</button><button id="pause">Пауза</button></div>
</div>
<div><button id="submit" disabled>Сохранить счёт</button><button id="refresh">Топ-10</button></div>
<p id="notice" role="status"></p>
<div id="ranking" style="display: none">
  <p><strong>🏆 Топ-10</strong></p>
  <p id="leaders" style="white-space: pre-wrap">Пока нет результатов</p>
</div>
<script>
  const TW = window.TelegramWidget;
  const submit = document.querySelector("#submit");
  const refresh = document.querySelector("#refresh");
  const notice = document.querySelector("#notice");
  function showTop(top) {
    document.querySelector("#leaders").textContent = top.length
      ? top.map((entry, i) => i + 1 + ". " + entry[0] + " — " + entry[1]).join("\n")
      : "Пока нет результатов";
  }
  function sharedTop() {
    try {
      showTop(JSON.parse(TW.publicData || "[]"));
    } catch {
      notice.textContent = "Не удалось прочитать рейтинг";
    }
  }
  function request(data) {
    if (!TW) {
      notice.textContent = "Рейтинг доступен в Telegram";
      return;
    }
    const submitting = data.startsWith("snake:score:");
    submit.disabled = refresh.disabled = true;
    notice.textContent = "Загрузка…";
    try {
      TW.request(data)
        .then((answer) => {
          const result = JSON.parse(answer.result);
          if (result.top) showTop(result.top);
          notice.textContent =
            result.error || (submitting ? "Результат сохранён" : "Рейтинг обновлён");
          submit.disabled = !over;
          refresh.disabled = false;
        })
        .catch(() => {
          notice.textContent = "Не удалось обновить рейтинг. Нажмите ещё раз.";
          submit.disabled = !over;
          refresh.disabled = false;
        });
    } catch {
      notice.textContent = "Запрос недоступен. Попробуйте ещё раз.";
      submit.disabled = !over;
      refresh.disabled = false;
    }
  }
  submit.addEventListener("click", () => {
    if (over) request("snake:score:" + (snake.length - 3));
  });
  refresh.addEventListener("click", () => {
    const ranking = document.querySelector("#ranking");
    const opening = ranking.style.display === "none";
    ranking.style.display = opening ? "block" : "none";
    document.querySelector("#game").style.display = opening ? "none" : "block";
    refresh.textContent = opening ? "К игре" : "Топ-10";
    if (opening) {
      if (running) {
        running = false;
        pause.textContent = "Продолжить";
        status.textContent = "Пауза";
      }
      request("snake:top");
    }
  });
  if (TW) {
    sharedTop();
    TW.onEvent("publicDataChanged", sharedTop);
    TW.watchPublicData();
  }
  const board = document.querySelector("#board");
  const ctx = board.getContext("2d");
  const score = document.querySelector("#score");
  const status = document.querySelector("#status");
  const pause = document.querySelector("#pause");
  let snake,
    food,
    direction,
    next,
    turned,
    running = false,
    over = false;
  function placeFood() {
    const empty = [];
    for (let i = 0; i < 196; i++) if (!snake.includes(i)) empty.push(i);
    food = empty[Math.floor(Math.random() * empty.length)];
  }
  function draw() {
    ctx.fillStyle = "#101820";
    ctx.fillRect(0, 0, 280, 280);
    ctx.fillStyle = "#ff647c";
    if (food !== undefined)
      ctx.fillRect((food % 14) * 20 + 2, Math.floor(food / 14) * 20 + 2, 16, 16);
    snake.forEach((cell, i) => {
      ctx.fillStyle = i === 0 ? "#c3ff88" : "#70cf60";
      ctx.fillRect((cell % 14) * 20 + 1, Math.floor(cell / 14) * 20 + 1, 18, 18);
    });
    score.textContent = "Счёт: " + (snake.length - 3);
  }
  function reset() {
    snake = [104, 103, 102];
    direction = next = 1;
    turned = false;
    over = false;
    submit.disabled = true;
    placeFood();
    draw();
  }
  function turn(value) {
    if (!running || turned || value === -direction) return;
    next = value;
    turned = true;
  }
  function tick() {
    if (!running || document.hidden) return;
    direction = next;
    turned = false;
    const head = snake[0];
    const cell = head + direction;
    const eating = cell === food;
    const wall =
      cell < 0 ||
      cell >= 196 ||
      (direction === 1 && head % 14 === 13) ||
      (direction === -1 && head % 14 === 0);
    if (wall || snake.slice(0, eating ? snake.length : -1).includes(cell)) {
      running = false;
      over = true;
      submit.disabled = false;
      status.textContent = "Игра окончена. Нажмите «Заново»";
      return;
    }
    snake.unshift(cell);
    if (eating) placeFood();
    else snake.pop();
    if (snake.length === 196) {
      running = false;
      over = true;
      submit.disabled = false;
      status.textContent = "Победа!";
    }
    draw();
  }
  for (const [id, value] of [
    ["up", -14],
    ["down", 14],
    ["left", -1],
    ["right", 1],
  ]) {
    document.querySelector("#" + id).addEventListener("click", () => turn(value));
  }
  document.querySelector("#restart").addEventListener("click", () => {
    reset();
    running = true;
    status.textContent = "Собирайте еду, избегайте стен и хвоста";
    document.querySelector("#restart").textContent = "Заново";
    pause.textContent = "Пауза";
  });
  pause.addEventListener("click", () => {
    if (over || document.querySelector("#restart").textContent === "Старт") return;
    running = !running;
    pause.textContent = running ? "Пауза" : "Продолжить";
    status.textContent = running ? "Собирайте еду, избегайте стен и хвоста" : "Пауза";
  });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && running) {
      running = false;
      pause.textContent = "Продолжить";
      status.textContent = "Пауза";
    }
  });
  reset();
  setInterval(tick, 180);
  if (window.TelegramWidget) window.TelegramWidget.ready();
</script>
