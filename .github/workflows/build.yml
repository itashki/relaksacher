name: Build AOT executable

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: nix shell path:.#bun-canary --command bun install --frozen-lockfile

      - name: Build executable
        run: npm run build

      - name: Check standalone startup without credentials
        shell: bash
        run: |
          binary="$PWD/dist/relaksacher"
          directory="$(mktemp -d)"
          cd "$directory"
          if output="$(FACTS_FILE=missing-facts.json5 "$binary" service 2>&1)"; then
            echo "Expected startup to reject missing configuration"
            exit 1
          fi
          if [[ "$output" != *"Cannot read facts from missing-facts.json5"* ]]; then
            printf '%s\n' "$output"
            exit 1
          fi

      # Tar preserves executable permissions, unlike a direct artifact upload.
      - name: Package executable and Silero helper
        run: >-
          tar -czf dist/relaksacher-linux-x64.tar.gz
          -C dist relaksacher -C .. scripts/silero-tts.py LICENSE

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: relaksacher-linux-x64
          path: dist/relaksacher-linux-x64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
